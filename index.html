<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdul Hadi's Extreme Force</title>
    <style>
        :root {
            --primary: #00ffcc;
            --bg-dark: #0a0f1d;
            --card-bg: rgba(18, 27, 48, 0.85);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --accent: #ff3366;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 20%, #1a2a4a 0%, var(--bg-dark) 100%);
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff3366;
            box-shadow: 0 0 8px #ff3366;
        }
        .dot.active {
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-style: solid;
            border-width: 1px;
            border-color: var(--primary);
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(0,255,204,0.2), rgba(0,128,128,0.4));
            color: var(--text-main);
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .logs {
            background: #050811;
            border: 1px solid rgba(139, 155, 180, 0.2);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--primary);
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Abdul Hadi's Extreme Force</h1>
        <p>Infinix Note 7 • Helio G70 Turbo Engine</p>
    </header>

    <div class="container">
        <!-- Shizuku Status Card -->
        <div class="card status-box">
            <span style="font-size: 0.9rem; color: var(--text-muted);">Shizuku Bridge:</span>
            <div class="status-indicator">
                <div class="dot active" id="shizukuDot"></div>
                <span id="shizukuStatusText">Connected (ADB)</span>
            </div>
        </div>

        <!-- Main Boost Trigger -->
        <button class="btn" onclick="triggerBoost()">🚀 Launch Extreme Force</button>

        <!-- Live Console Logs -->
        <div class="card" style="padding: 12px;">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px;">Execution Logs:</div>
            <div class="logs" id="logConsole">[System] Initialized core environment...
[Shizuku] Bridge active via ADB v13.5.
[Ready] Waiting for user command to boost PUBG Mobile.</div>
        </div>
    </div>

    <div class="footer-note">
        Safe Non-Root Optimization • Zero ID Ban Risk
    </div>

    <script>
        function logMessage(msg) {
            const consoleBox = document.getElementById('logConsole');
            consoleBox.innerText += "\n" + msg;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function triggerBoost() {
            logMessage("[Boost] Releasing memory caches...");
            setTimeout(() => {
                logMessage("[CPU] Locking MediaTek Helio G70 high performance cluster...");
            }, 400);
            setTimeout(() => {
                logMessage("[Process] Throttling background background services safely...");
            }, 800);
            setTimeout(() => {
                logMessage("[Success] Extreme Force active! Rock-stable 60 FPS ready for PUBG Mobile.");
            }, 1200);
        }
    </script>
</body>
</html>
