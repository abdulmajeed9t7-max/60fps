<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 FPS Gaming Booster</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .status {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background: #0369a1;
        }
        .fps-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 60 FPS Game Booster</h1>

        <div class="card fps-box">
            <div>
                <h3>Target Refresh Rate</h3>
                <div class="status">60 FPS Locked</div>
            </div>
            <div style="font-size: 28px;">⚡</div>
        </div>

        <div class="card">
            <h3>Background Optimization</h3>
            <p style="font-size: 14px; color: #94a3b8;">Clears RAM and stabilizes frame delivery to prevent micro-stutters.</p>
        </div>

        <div class="card">
            <h3>Select Game</h3>
            <select style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 6px; margin-top: 5px;">
                <option>PUBG Mobile / BGMI</option>
                <option>Free Fire</option>
                <option>Call of Duty Mobile</option>
            </select>
        </div>

        <button onclick="startBoost()">🚀 START BOOSTING</button>
    </div>

    <script>
        function startBoost() {
            alert("🚀 Gaming Mode Activated! 60 FPS Lock enforced successfully.");
        }
    </script>

</body>
</html>
